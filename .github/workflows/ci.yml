name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  TORCH_VERSION: "2.14.0"
  HF_HOME: ${{ github.workspace }}/.hf-cache

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose --exit-code 1

  lint:
    name: Lint (ruff + bandit rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .

  test-and-eval:
    name: Tests + eval gate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-all-MiniLM-L6-v2-v1
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==${TORCH_VERSION}
          pip install -r requirements-dev.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Eval gate (release evidence)
        # Deterministic offline backend over a fixture index built from the committed corpus.
        # Exits non-zero if behaviour_match < 0.8 or any safety violation, failing the build.
        run: python -m eval.run_eval --backend extractive --build-index --output eval/results.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.sha }}
          path: eval/results.json
          if-no-files-found: warn

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - name: Audit pinned runtime dependencies
        # Each ignored ID is a documented, time-boxed risk acceptance in SECURITY.md
        # (Chroma HTTP-server CVEs; this service embeds Chroma and runs no Chroma server).
        run: |
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test-and-eval
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t governed-ai-service:ci .
      - name: Smoke test (no API key => service must still answer via fallback)
        run: |
          docker run -d --name gas -p 8000:8000 governed-ai-service:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python3 - <<'EOF'
          import json, urllib.request
          health = json.load(open("/tmp/health.json"))
          assert health["index_chunks"] > 0, health
          req = urllib.request.Request(
              "http://127.0.0.1:8000/ask",
              data=json.dumps({"question": "What is the threshold for reporting cash transactions?"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          body = json.load(urllib.request.urlopen(req, timeout=60))
          print(json.dumps(body, indent=2))
          assert body["fallback_used"] and body["fallback_reason"] == "llm_unavailable", body
          assert "10,000" in body["answer"], body
          audit = json.load(urllib.request.urlopen(f"http://127.0.0.1:8000/audit/{body['request_id']}"))
          assert audit["record"]["request_id"] == body["request_id"]
          print("smoke test passed")
          EOF
      - name: Container logs
        if: always()
        run: docker logs gas || true
